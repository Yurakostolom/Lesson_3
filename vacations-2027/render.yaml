services:
  - type: web
    name: medsonar-vacations-2027
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: COOKIE_SECURE
        value: "1"
      - key: ADMIN_LOGIN
        value: admin01
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_SECRET_KEY
        generateValue: true
    disk:
      name: vacations-data
      mountPath: /var/data
      sizeGB: 1
